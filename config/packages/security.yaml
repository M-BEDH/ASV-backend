security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id   # à la place de email, car on va utiliser l'id pour l'authentification 

    firewalls:
        main:
            lazy: true
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/auth/login,    roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/clinics/by-email, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/clinics$,      roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api,               roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
