nelmio_api_doc:
    documentation:
        info:
            title: ASV API
            description: API de suivi vétérinaire (cliniques, refuges, associations, particuliers)
            version: 1.0.0
        components:
            securitySchemes:
                Bearer:
                    type: apiKey
                    in: header
                    name: Authorization
                    description: 'Token JWT, format: Bearer {token}'
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
